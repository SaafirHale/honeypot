[project]
name = "honeypot-collector"
version = "0.1.0"
description = "Aggregate Cowrie honeypot logs into anonymised, publishable statistics."
requires-python = ">=3.11"
dependencies = ["maxminddb>=2.6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
honeypot-collector = "honeypot_collector.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["honeypot_collector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
