# Overrides on top of Cowrie's bundled cowrie.cfg.dist. Only what differs is here.

[honeypot]
# The default hostname (svr04) is a well-known Cowrie fingerprint.
hostname = nas-backup01
timezone = UTC
# Daily rotation of cowrie.json -> cowrie.json.YYYY-MM-DD; deploy/host/retention.sh prunes.
logtype = rotating
# Session transcripts stay on the box for the operator. They are never published.
ttylog = true
# Cap on files an attacker can push via SFTP/SCP. Downloads fail anyway (egress is blocked).
download_limit_size = 10485760
idle_timeout = 180
authentication_timeout = 120

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
# Banner matching the host OS family, instead of the Debian default.
version = SSH-2.0-OpenSSH_9.6p1 Ubuntu-3ubuntu13.5
# SFTP stays on: uploads are how payload hashes get recorded.
sftp_enabled = true
# No SSH port forwarding of any kind. Cowrie fakes direct-tcpip by default,
# but the honeypot should not offer a tunnel endpoint at all.
forwarding = false
forward_redirect = false
forward_tunnel = false

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false
